# phpMyAdmin: http://pma.test -> pma_panel konteyneri (port yazmadan erişim)
<VirtualHost *:80>
    ServerName pma.test

    ProxyPreserveHost On
    ProxyPass        / http://phpmyadmin/
    ProxyPassReverse / http://phpmyadmin/

    ErrorLog ${APACHE_LOG_DIR}/pma_error.log
    CustomLog ${APACHE_LOG_DIR}/pma_access.log combined
</VirtualHost>
