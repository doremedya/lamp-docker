# Mezuniyet Fotoğrafçısı (~/projeler/mezuniyetfotografcisi.com.tr)
<VirtualHost *:80>
    ServerName mezuniyetfotografcisi.test
    ServerAlias www.mezuniyetfotografcisi.test test.mezuniyetfotografcisi.test

    DocumentRoot /var/www/html/mezuniyetfotografcisi.com.tr

    <Directory /var/www/html/mezuniyetfotografcisi.com.tr>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mezuniyetfotografcisi_error.log
    CustomLog ${APACHE_LOG_DIR}/mezuniyetfotografcisi_access.log combined
</VirtualHost>
