# Mailpit: http://mail.test -> yakalanan e-postalar (mailpit konteyneri)
<VirtualHost *:80>
    ServerName mail.test

    ProxyPreserveHost On
    # Canlı güncelleme (websocket)
    ProxyPass        /api/events ws://mailpit:8025/api/events
    ProxyPass        / http://mailpit:8025/
    ProxyPassReverse / http://mailpit:8025/

    ErrorLog ${APACHE_LOG_DIR}/mail_error.log
    CustomLog ${APACHE_LOG_DIR}/mail_access.log combined
</VirtualHost>
